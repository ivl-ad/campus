<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>Catalog editor</title>
<meta content="width=device-width, initial-scale=1" name="viewport"/>
<style>
  :root{
    --bg:#f6f6f3; --panel:#fff; --ink:#17210f; --muted:#6b7466; --line:#dcdcd4;
    --green:#2e6b22; --green-dark:#1d4a15; --red:#b23b32; --amber:#8a6d1f;
    --head:#eef0ea;
  }
  *{box-sizing:border-box}
  [hidden]{display:none !important}   /* the hidden attribute always wins over display rules */
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--ink);
       font:14px/1.45 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
       display:flex;flex-direction:column}

  header{background:var(--panel);border-bottom:1px solid var(--line);padding:10px 14px;
         display:flex;gap:10px;align-items:center;flex-wrap:wrap;position:sticky;top:0;z-index:5}
  h1{font-size:15px;margin:0 8px 0 0;font-weight:650;white-space:nowrap}

  /* section switch: Products | Partners. The tabs name the section on screen,
     so the h1 is kept for screen readers only -- it saves the header a line. */
  h1.sr-only{position:absolute;width:1px;height:1px;margin:-1px;overflow:hidden;clip:rect(0 0 0 0)}
  .tabs{display:flex;gap:2px;background:var(--head);border-radius:7px;padding:2px;margin-right:4px}
  .tabs a{padding:4px 12px;border-radius:5px;color:var(--muted);text-decoration:none;
          font-weight:600;white-space:nowrap}
  .tabs a:hover{color:var(--ink)}
  .tabs a[aria-current]{background:var(--panel);color:var(--ink);box-shadow:0 1px 2px rgba(23,33,15,.16)}
  .count{color:var(--muted);white-space:nowrap}
  #who{cursor:default}
  .spacer{flex:1}
  input[type=search]{padding:6px 9px;border:1px solid var(--line);border-radius:6px;
                     background:#fff;min-width:200px;font:inherit}
  button{font:inherit;border:1px solid var(--line);background:#fff;color:var(--ink);
         padding:6px 12px;border-radius:6px;cursor:pointer;white-space:nowrap}
  button:hover:not(:disabled){background:#f0f0ea}
  button:disabled{opacity:.45;cursor:not-allowed}
  button.primary{background:var(--green);border-color:var(--green);color:#fff;font-weight:600}
  button.primary:hover:not(:disabled){background:var(--green-dark)}
  button.ghost-danger{color:var(--red);border-color:#e3c6c3}
  button.ghost-danger:hover:not(:disabled){background:#fbf0ef}

  /* header dropdowns (columns menu, version history) */
  .menu{position:absolute;top:calc(100% - 4px);right:14px;background:var(--panel);
        border:1px solid var(--line);border-radius:8px;box-shadow:0 10px 28px rgba(23,33,15,.16);
        padding:8px;z-index:30;display:none;max-height:65vh;overflow:auto;font-size:13px}
  .menu.open{display:block}
  #colsMenu{min-width:190px}
  #histPanel{min-width:420px;max-width:min(560px,90vw)}
  .menu-head{padding:2px 6px 6px;color:var(--muted)}
  .menu label{display:flex;gap:8px;align-items:center;padding:4px 6px;cursor:pointer;
              border-radius:5px;white-space:nowrap}
  .menu label:hover{background:#f0f0ea}
  .hist-row{display:flex;gap:10px;align-items:center;padding:6px;border-bottom:1px solid var(--line)}
  .hist-row:last-child{border-bottom:0}
  .hist-when{color:var(--muted);white-space:nowrap;min-width:64px}
  .hist-msg{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .hist-cur{color:var(--green-dark);font-weight:600;white-space:nowrap}
  .hist-row button{padding:3px 8px;font-size:12px}

  #status{padding:8px 14px;font-size:13px;display:none}
  #status.show{display:block}
  #status.ok{background:#e8f3e4;color:var(--green-dark);border-bottom:1px solid #cfe4c8}
  #status.err{background:#fbeceb;color:var(--red);border-bottom:1px solid #f0d3d0;
              white-space:pre-wrap;font-family:ui-monospace,Menlo,Consolas,monospace}
  #status.warn{background:#fdf6e3;color:var(--amber);border-bottom:1px solid #efe0bb}

  .wrap{flex:1;overflow:auto;background:var(--panel)}
  table{border-collapse:separate;border-spacing:0;table-layout:fixed}
  th,td{border-right:1px solid var(--line);border-bottom:1px solid var(--line);
        padding:0;vertical-align:top;overflow:hidden}
  thead th{position:sticky;top:0;z-index:3;background:var(--head);text-align:left;
           padding:7px 8px;font-size:12px;font-weight:650;white-space:nowrap;
           text-overflow:ellipsis;border-bottom:2px solid var(--line)}
  thead th .rz{position:absolute;top:0;right:-4px;width:8px;height:100%;
               cursor:col-resize;z-index:6;touch-action:none}
  thead th .rz:hover{background:rgba(46,107,34,.28)}
  tbody tr:hover td{background:#fafaf6}
  tbody tr.dropped td{opacity:.4;text-decoration:line-through}

  td.rownum,th.rownum{position:sticky;left:0;z-index:2;background:var(--head);
                      text-align:right;padding:6px 8px;color:var(--muted);
                      font-variant-numeric:tabular-nums;width:46px;min-width:46px}
  thead th.rownum{z-index:4}
  tbody tr:hover td.rownum{background:#e6e8e0}

  /* Another editor's cursor is parked on this row. */
  tbody tr.peer td.rownum{box-shadow:inset 4px 0 0 0 var(--peer,#888)}

  /* The name column stays pinned (like # and row) so you keep your bearings
     however far right the table is scrolled. left = 46 (#) + the row column. */
  th.w-name,td.w-name{position:sticky;left:calc(46px + var(--act-w));background:var(--panel)}
  thead th.w-name{z-index:4;background:var(--head)}
  tbody td.w-name{z-index:2}

  td input,td textarea,td select{width:100%;border:0;background:transparent;font:inherit;
        color:inherit;padding:6px 8px;resize:none;display:block}
  td input:focus,td textarea:focus,td select:focus{outline:2px solid var(--green);
        outline-offset:-2px;background:#fff;position:relative;z-index:1}
  td.invalid input{background:#fbeceb}
  td select{cursor:pointer}
  td textarea{min-height:32px;line-height:1.35}

  /* Row controls sit at the far left, pinned next to the row number so they
     stay reachable however far right the table is scrolled. */
  td.act,th.act{position:sticky;left:46px;z-index:2;background:var(--head);
        text-align:center;padding:4px 6px;white-space:nowrap;
        width:var(--act-w);min-width:var(--act-w);border-right:2px solid var(--line)}
  thead th.act{z-index:4}
  tbody tr:hover td.act{background:#e6e8e0}
  td.act button{padding:3px 7px;font-size:12px;line-height:1.4}
  td.act button+button{margin-left:4px}

  footer{background:var(--panel);border-top:1px solid var(--line);padding:8px 14px;
         color:var(--muted);font-size:12px;display:flex;gap:14px;flex-wrap:wrap}
  .pill{background:var(--head);border-radius:99px;padding:2px 9px}
  .dirty{color:var(--amber);font-weight:600}
  .thumb{width:34px;height:34px;object-fit:contain;background:#fff;border:1px solid var(--line);
         border-radius:4px;display:block;margin:4px auto}

  /* ---- partners view ---- */
  :root{--act-w:122px}
  .view-partners{--act-w:178px}
  .view-partners .thumb{width:84px;height:40px;padding:3px}
  .view-partners td.broken::after{content:"can't load";display:block;text-align:center;
        color:var(--red);font-size:11px;margin:-2px 0 4px}
  .view-partners td.act button.mv{padding:3px 6px}

  /* Live preview of the home page strip, drawn by js/partner-marquee.js from
     the draft. Boxes mirror .logo-marquee-box on the site, at its phone size. */
  #preview{background:var(--panel);border-bottom:1px solid var(--line)}
  .pv-head{display:flex;gap:10px;align-items:center;padding:6px 14px;font-size:13px;flex-wrap:wrap}
  .pv-head strong{font-weight:650}
  .pv-head button{padding:3px 10px;font-size:12px}
  #preview.collapsed .pv-stage{display:none}
  .pv-stage{overflow:hidden;border-top:1px solid #eeece6;background:#fff}
  .pv-main{display:flex;width:max-content;animation:pv-scroll 40s linear infinite}
  .pv-stage:hover .pv-main{animation-play-state:paused}
  @keyframes pv-scroll{to{transform:translateX(-50%)}}
  @media (prefers-reduced-motion:reduce){.pv-main{animation:none}}
  .pv-list{display:flex}
  #preview .logo-marquee-box{flex:none;width:150px;aspect-ratio:1;display:flex;flex-direction:column;
        align-items:center;justify-content:center;border-right:1px solid #eeece6;overflow:hidden}
  #preview .partner-box{text-decoration:none;transition:background-color .2s ease}
  #preview .partner-box:hover,#preview .partner-box:focus-visible{background-color:#f7f6f2}
  #preview .partner-logo{display:block;max-width:70%;max-height:42%;object-fit:contain}
  #preview .pv-default img{width:60%;filter:grayscale(1);opacity:.14}

  /* ---- blog + team views ---- */
  .view-blog .thumb{width:56px;height:36px;object-fit:cover}
  .view-team .thumb{width:40px;height:40px;object-fit:cover;border-radius:50%}
  td select.st,.dr-field select.st{font-weight:650}
  select.st-live{color:var(--green-dark)}
  select.st-draft{color:var(--amber)}
  tbody tr.is-draft td.w-name input{font-style:italic;color:var(--muted)}
  td button.body-btn{width:100%;border:0;border-radius:0;background:transparent;text-align:left;
        padding:6px 8px;color:var(--green-dark);font-weight:600}
  td button.body-btn:hover{background:#eef5ea}
  td button.body-btn.empty{color:var(--amber)}
  td input[type=datetime-local]{min-width:0}

  /* Side panel: one post / one person as a form. Edits sync like cell edits. */
  #drawerShade{position:fixed;inset:0;background:rgba(23,33,15,.3);z-index:40}
  #drawer{position:fixed;top:0;right:0;bottom:0;width:min(920px,100vw);background:var(--bg);z-index:41;
          display:flex;flex-direction:column;box-shadow:-12px 0 40px rgba(23,33,15,.22)}
  #drawer[hidden],#drawerShade[hidden]{display:none}
  .dr-head{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 16px;
           background:var(--panel);border-bottom:1px solid var(--line)}
  .dr-head strong{font-size:15px;max-width:48ch;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .dr-head a{color:var(--green-dark);font-weight:600;text-decoration:none;white-space:nowrap}
  .dr-head a:hover{text-decoration:underline}
  .dr-body{flex:1;overflow:auto;padding:18px 22px 80px}
  .dr-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px 16px;margin-bottom:16px}
  .dr-field{display:flex;flex-direction:column;gap:6px;margin-bottom:16px;min-width:0}
  .dr-grid .dr-field{margin-bottom:0}
  .dr-field > label{font-size:12px;font-weight:650;color:var(--muted);letter-spacing:.02em}
  .dr-field .hint{font-size:12px;color:var(--muted);line-height:1.4}
  .dr-field input,.dr-field select,.dr-field textarea{font:inherit;padding:8px 10px;border:1px solid var(--line);
        border-radius:7px;background:#fff;color:var(--ink);width:100%;min-width:0}
  .dr-field textarea{resize:vertical;min-height:84px;line-height:1.5}
  .dr-field textarea.lg{min-height:190px}
  .dr-field input:focus,.dr-field select:focus,.dr-field textarea:focus{outline:2px solid var(--green);outline-offset:-1px}
  .dr-row{display:flex;gap:8px;align-items:center}
  .dr-row > input,.dr-row > select{flex:1}
  .dr-field input.dr-title{font-size:21px;font-weight:650;padding:10px 12px}
  .dr-img{max-width:280px;max-height:170px;border-radius:8px;border:1px solid var(--line);background:#fff;
          align-self:flex-start;object-fit:cover}
  .dr-img[hidden]{display:none}
  .dr-url{font-size:12px;color:var(--muted);word-break:break-all}

  /* The article editor. Paste from Google Docs / Word / a web page: it is
     cleaned to plain structure on the way in (and again on Save). */
  .rich{border:1px solid var(--line);border-radius:8px;background:#fff}
  .rich-bar{display:flex;flex-wrap:wrap;gap:4px;padding:6px;background:var(--head);border-bottom:1px solid var(--line);
            border-radius:8px 8px 0 0;position:sticky;top:-18px;z-index:2}
  .rich-bar button{padding:3px 9px;font-size:12.5px}
  .rich-bar button[aria-pressed="true"]{background:var(--green);color:#fff;border-color:var(--green)}
  .rich-bar .sep{width:1px;background:var(--line);margin:2px 3px}
  .rich-ed{min-height:380px;padding:18px 24px;font:16px/1.65 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
           color:#1a1a1a;outline:none;overflow-wrap:anywhere}
  .rich-ed:focus{box-shadow:inset 0 0 0 2px var(--green)}
  .rich-ed:empty::before{content:attr(data-placeholder);color:var(--muted)}
  .rich-ed h2,.rich-ed h3,.rich-ed h4{font-family:Georgia,"Times New Roman",serif;font-weight:400;line-height:1.2;margin:1.1em 0 .45em}
  .rich-ed h2{font-size:30px} .rich-ed h3{font-size:24px} .rich-ed h4{font-size:19px}
  .rich-ed > :first-child{margin-top:0}
  .rich-ed p{margin:0 0 .85em}
  .rich-ed ul,.rich-ed ol{margin:0 0 .85em;padding-left:1.6em}
  .rich-ed blockquote{margin:0 0 .85em;padding:4px 16px;border-left:3px solid var(--green);color:#5a5a5a}
  .rich-ed a{color:var(--green-dark)}
  .rich-ed img{max-width:100%;height:auto;border-radius:6px}
  .rich-ed table{border-collapse:collapse;margin:0 0 .85em}
  .rich-ed td,.rich-ed th{border:1px solid var(--line);padding:4px 8px}
  .rich-src{display:block;width:100%;min-height:380px;border:0;padding:14px 16px;resize:vertical;
            font:13px/1.55 ui-monospace,Menlo,Consolas,monospace;color:var(--ink);background:#fcfcfa}
  .rich-src[hidden]{display:none}
  .rich-foot{display:flex;justify-content:space-between;flex-wrap:wrap;gap:4px 12px;padding:6px 10px;
             border-top:1px solid var(--line);font-size:12px;color:var(--muted);background:var(--head);border-radius:0 0 8px 8px}
  .rel-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px}

  /* Form | Raw block switch, and the raw block panel (blog). */
  .dr-seg{display:inline-flex;gap:2px;background:var(--head);border-radius:7px;padding:2px}
  .dr-seg[hidden]{display:none}
  .dr-seg button{border:0;background:transparent;color:var(--muted);font-weight:600;padding:4px 11px}
  .dr-seg button:hover:not(:disabled){background:transparent;color:var(--ink)}
  .dr-seg button[aria-pressed="true"]{background:var(--panel);color:var(--ink);box-shadow:0 1px 2px rgba(23,33,15,.16)}
  #drBody[hidden],#drRaw[hidden]{display:none}
  .raw-bar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:10px}
  .raw-help{font-size:12.5px;color:var(--muted);margin:0 0 10px;line-height:1.5;max-width:92ch}
  .raw-text{display:block;width:100%;min-height:52vh;border:1px solid var(--line);border-radius:8px;padding:12px 14px;
            font:13px/1.55 ui-monospace,Menlo,Consolas,monospace;color:var(--ink);background:#fff;resize:vertical;tab-size:2}
  .raw-text:focus{outline:2px solid var(--green);outline-offset:-1px}
  .raw-stale{background:#fdf6e3;color:var(--amber);border:1px solid #efe0bb;border-radius:7px;padding:7px 10px;
             margin:0 0 10px;font-size:13px}
  .raw-stale[hidden]{display:none}
  .raw-report{margin-top:12px;font-size:13px;line-height:1.45}
  .raw-report h4{margin:12px 0 4px;font-size:11.5px;text-transform:uppercase;letter-spacing:.05em}
  .raw-report ul{margin:0;padding-left:20px}
  .raw-report li{margin:2px 0}
  .raw-report .r-err h4,.raw-report .r-err li{color:var(--red)}
  .raw-report .r-warn h4{color:var(--amber)}
  .raw-report .r-note h4,.raw-report .r-note li{color:var(--muted)}
  .raw-report .r-ok{color:var(--green-dark);font-weight:650;margin:4px 0}
</style>
<script src="../js/partner-marquee.js"></script>
</head>
<body>

<header>
  <h1 id="title" class="sr-only">Catalog editor</h1>
  <nav class="tabs" aria-label="Section">
    <a href="./" data-view="products">Products</a>
    <a href="./?view=partners" data-view="partners">Partners</a>
    <a href="./?view=blog" data-view="blog">Blog</a>
    <a href="./?view=team" data-view="team">Team</a>
    <a href="signups">Signups</a>
  </nav>
  <span class="count" id="count">loading…</span>
  <span class="count" id="who"></span>
  <input type="search" id="q" placeholder="Filter by name, id, merchant…  ( / )" autocomplete="off"/>
  <span class="spacer"></span>
  <button id="undo" disabled title="Undo (Ctrl+Z)">↶ Undo</button>
  <button id="redo" disabled title="Redo (Ctrl+Shift+Z or Ctrl+Y)">↷ Redo</button>
  <button id="cols" title="Show, hide and resize columns">Columns ▾</button>
  <button id="hist" style="display:none" title="Every saved version — load one back into the draft">History ▾</button>
  <button id="add">+ Add product</button>
  <button id="reload">Reload</button>
  <button class="primary" id="save" disabled>Save</button>
  <div class="menu" id="colsMenu"></div>
  <div class="menu" id="histPanel"></div>
</header>

<div id="status"></div>

<section id="preview" hidden>
  <div class="pv-head">
    <strong>Home page strip</strong>
    <span class="count" id="pvNote"></span>
    <span class="spacer"></span>
    <button id="pvToggle" type="button">Hide preview</button>
  </div>
  <div class="pv-stage" id="pvStage"></div>
</section>

<div class="wrap">
  <table id="cattable">
    <thead>
      <tr id="headrow"></tr>
    </thead>
    <tbody id="rows"></tbody>
  </table>
</div>

<div id="drawerShade" hidden></div>
<aside id="drawer" hidden role="dialog" aria-labelledby="drTitle">
  <div class="dr-head">
    <strong id="drTitle">Edit</strong>
    <span class="count" id="drMeta"></span>
    <span class="spacer"></span>
    <div class="dr-seg" id="drMode" role="group" aria-label="Edit as" hidden>
      <button type="button" data-mode="form" aria-pressed="true" title="Edit field by field">Form</button>
      <button type="button" data-mode="raw" aria-pressed="false" title="The whole post as one block of text you can copy, edit or paste">Raw block</button>
    </div>
    <a id="drView" target="_blank" rel="noopener" hidden>Open live page ↗</a>
    <button id="drClose" type="button" class="primary" title="Close (Esc). Edits are already in the shared draft.">Done</button>
  </div>
  <div class="dr-body" id="drBody"></div>
  <div class="dr-body" id="drRaw" hidden></div>
</aside>

<footer>
  <span class="pill" id="backups">backups: –</span>
  <span id="dirty"></span>
  <span class="spacer"></span>
  <span id="note">Save writes js/products.js, keeps a numbered backup in js/backups/, and re-bakes store.html + index.html.</span>
</footer>

<script>
(function () {
  'use strict';

  // Category list must match SITE_CATEGORIES in build_listings.py and
  // CATEGORIES in js/listing-page.js. The server sends it when it can.
  var CATEGORIES = [
    ['dorm-living-essentials', 'Dorm & Living Essentials'],
    ['academic-essentials', 'Academic Essentials'],
    ['personal-lifestyle', 'Personal Lifestyle'],
    ['event-tickets-travel', 'Event Tickets & Travel'],
    ['financial-services', 'Financial Services'],
    ['laundry-cleaning', 'Laundry & Cleaning'],
    ['living-social-spaces', 'Living & Social Spaces'],
    ['bathroom', 'Bathroom'],
    ['kitchen-dining', 'Kitchen & Dining'],
    ['bedroom-study', 'Bedroom & Study']
  ];

  // A full https:// address; a logo may also be a file in the site's images/.
  var URL_RE = /^https?:\/\/[^\s<>"']+$/i;
  var LOGO_RE = /^(https?:\/\/[^\s<>"']+|\/?images\/[^\s<>"']+)$/i;

  /*
   * The two sections this page edits, with one engine. /admin/ is the product
   * catalog, exactly as it always was; /admin/?view=partners is the partner
   * logo strip on the home page. Each has its own file, its own shared draft
   * (/api/draft?doc=partners) and its own History.
   *
   *   cols    [field, menu label, default width, header note]; _thumb is the
   *           image preview. text = textarea fields, blank removes them.
   */
  var DOCS = {
    products: {
      title: 'Catalog editor',
      one: 'product', many: 'products', what: 'catalog',
      file: 'js/products.js', listKey: 'products',
      parseFile: function (t) { return parseList(t, 'PRODUCTS'); },
      draftApi: '/api/draft', saveApi: '/api/catalog', historyApi: '/api/history',
      cols: [
        ['_thumb', 'image', 52, '', 'img'],
        ['id', 'id', 220, '(permalink)'],
        ['name', 'name', 300],
        ['cat', 'category', 180],
        ['merchant', 'merchant', 150],
        ['merchantSlug', 'merchantSlug', 130],
        ['price', 'price', 90],
        ['url', 'url', 240],
        ['img', 'img url', 240, '', 'img'],
        ['desc', 'desc', 260, '(optional)'],
        ['note', 'note', 180, '(internal — in the public data file, not secret)']
      ],
      text: ['desc', 'note'],
      thumb: 'img',
      search: ['id', 'name', 'merchant', 'catLabel'],
      filterHint: 'Filter by name, id, merchant…  ( / )',
      blank: function () { return { cat: CATEGORIES[0][0], catLabel: CATEGORIES[0][1] }; },
      soloNote: 'Save writes js/products.js, keeps a numbered backup in js/backups/, and re-bakes store.html + index.html.',
      syncNote: 'Edits sync to every open editor within a few seconds — nothing ' +
        'touches the site until Save, which publishes the shared draft: it writes js/products.js ' +
        'and re-bakes store.html + index.html (~1 min). Every Save is kept in History.',
      saveTitle: 'Publish the shared draft: commits js/products.js and rebuilds the site',
      publishing: 'the site is rebuilding (~1 min)',
      problems: function (rows) {
        var out = [], seen = {};
        rows.forEach(function (r, i) {
          var p = r.data, at = 'row ' + (i + 1) + ' (' + (p.name || p.id || 'untitled') + ')';

  var pendingOps = [];     // creates/deletes not yet sent
  var flushTimer = null, pollTimer = null, inFlight = false;
  var sendingOps = 0;      // edits riding on the request in flight
  var saving = false, saveAfterFlush = false, saveFlushTries = 0, saveDropped = false;
  var lastActivity = Date.now();
  var focusRid = null, sentFocus = '<none>', presenceSentAt = 0;

  // devices -- or two tabs -- should count as two editors), sticky name.

    return String(s || '').replace(/[™℠®©]/g, '').normalize('NFKD').replace(/[\u0300-\u036f]/g, '').toLowerCase()
      .replace(/['’"]/g, '')
      .replace(/[^a-z0-9]+/g, '-')
      .replace(/^-+/, '').slice(0, 60).replace(/-+$/, '');
