    }
    m = /^([A-Za-z]+)\.?\s+(\d{1,2}),?\s+(\d{4})$/.exec(v);
    if (m) {
      var mi = -1;
      MONTHS.forEach(function (name, i) { if (name.indexOf(m[1].toLowerCase()) === 0 && m[1].length >= 3) mi = i; });
      if (mi < 0 || !realDay(+m[3], mi + 1, +m[2])) return NaN;
      return fromZoned(m[3] + '-' + pad2(mi + 1) + '-' + pad2(m[2]) + 'T00:00');
    }
    return NaN;
  }

  function looksLikeMarkdown(t) {
    if (/<[a-z][^>]*>/i.test(t)) return false;
    return /^#{1,6}\s/m.test(t) || /^\s*[-*+]\s+\S/m.test(t) || /^\s*\d+[.)]\s+\S/m.test(t) ||
           /\*\*[^*\n]+\*\*/.test(t) || /\[[^\]\n]+\]\([^)\s]+\)/.test(t);
  }

  // Enough Markdown for an AI's article: headings, lists, quotes, bold,
  // italic, links, images, rules. (# and ## both become <h2>: the title is the page's h1.)
  function markdownToHtml(md) {
    var out = [], para = [], list = null;
    function inline(t) {
      return escText(t)
        .replace(/!\[([^\]]*)\]\(([^)\s]+)\)/g, '<img src="$2" alt="$1">')
        .replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, '<a href="$2">$1</a>')
        .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
        .replace(/__([^_]+)__/g, '<strong>$1</strong>')
        .replace(/(^|[^*\w])\*([^*\s][^*]*?)\*(?!\w)/g, '$1<em>$2</em>')
        .replace(/(^|[^_\w])_([^_\s][^_]*?)_(?!\w)/g, '$1<em>$2</em>');
    }
    function flushPara() { if (para.length) { out.push('<p>' + inline(para.join(' ')) + '</p>'); para = []; } }
    function flushList() {
      if (!list) return;
      out.push('<' + list.tag + '>' + list.items.map(function (i) { return '<li>' + inline(i) + '</li>'; }).join('') +
               '</' + list.tag + '>');
      list = null;
    }
    String(md).replace(/\r\n?/g, '\n').split('\n').forEach(function (line) {
      var m;
      if (!line.trim()) { flushPara(); flushList(); return; }
      if ((m = /^(#{1,6})\s+(.*?)\s*#*\s*$/.exec(line))) {
        flushPara(); flushList();
        var h = Math.min(4, Math.max(2, m[1].length));
        out.push('<h' + h + '>' + inline(m[2]) + '</h' + h + '>');
        return;
      }
      if (/^\s*([-*_])(\s*\1){2,}\s*$/.test(line)) { flushPara(); flushList(); out.push('<hr>'); return; }
      if ((m = /^\s*[-*+]\s+(.*)$/.exec(line))) {
        flushPara();
        if (!list || list.tag !== 'ul') { flushList(); list = { tag: 'ul', items: [] }; }
        list.items.push(m[1]);
        return;
      }
      if ((m = /^\s*\d+[.)]\s+(.*)$/.exec(line))) {
        flushPara();
        if (!list || list.tag !== 'ol') { flushList(); list = { tag: 'ol', items: [] }; }
        list.items.push(m[1]);
        return;
      }
      if ((m = /^\s*>\s?(.*)$/.exec(line))) { flushPara(); flushList(); out.push('<blockquote><p>' + inline(m[1]) + '</p></blockquote>'); return; }
      if (list) flushList();
      para.push(line.trim());
    });
    flushPara(); flushList();
    return out.join('\n');
  }

  // A block's article as HTML: Markdown and plain text are converted first.
  function articleHtml(body) {
    if (!body) return '';
    if (looksLikeMarkdown(body)) return markdownToHtml(body);
    if (!/<[a-z][^>]*>/i.test(body)) return textToHtml(body);
    return body;
  }

  // Code that has no place in an article, counted on the block as pasted
  // (before cleaning) so the person sees what was there. Parsed with
  // DOMParser -- inert: nothing runs or loads -- and judged on real elements
  // and attributes, so text such as alt="step one = measure" is never
  // mistaken for an event handler.
  function unsafeParts(html) {
    var found = [];
    if (!html) return found;
    var doc = new DOMParser().parseFromString('<!doctype html><body>' + html + '</body>', 'text/html');
    function count(sel, label) {
      var n = doc.querySelectorAll(sel).length;
      if (n) found.push(n + ' × ' + label);
    }
    count('script', '<script> element');
    count('style', '<style> element');
    count('iframe, frame, frameset', '<iframe> embed');
    count('object, embed, applet', 'embedded object');
    count('form, input, button, select, textarea', 'form control');
    count('link, meta, base', '<link>/<meta>/<base> tag');
    count('xmp, noembed, noframes, plaintext, template, noscript', 'hidden raw-code block');
    var handlers = 0, jsLinks = 0, dataFiles = 0;
    Array.prototype.forEach.call(doc.querySelectorAll('*'), function (node) {
      for (var i = 0; i < node.attributes.length; i++) {
        var a = node.attributes[i], name = a.name.toLowerCase();
        var val = String(a.value).replace(/[\s\u0000-\u001f]+/g, '').toLowerCase();
        if (/^on/.test(name)) handlers++;
        if (/^(href|src|action|formaction|xlink:href|data)$/.test(name)) {
          if (/^(javascript|vbscript):/.test(val)) jsLinks++;
          else if (/^data:/.test(val)) dataFiles++;
        }
      }
    });
    if (handlers) found.push(handlers + ' × event handler (onclick=, onerror=…)');
    if (jsLinks) found.push(jsLinks + ' × javascript: link');
    if (dataFiles) found.push(dataFiles + ' × embedded data: file');
    return found;
  }

  function unclosedTags(html) {
    var out = [];
    ['strong', 'em', 'b', 'i', 'a', 'h2', 'h3', 'h4', 'ul', 'ol', 'blockquote', 'table'].forEach(function (t) {
      var open = (html.match(new RegExp('<' + t + '(\\s[^>]*)?>', 'gi')) || []).length;
      var close = (html.match(new RegExp('</' + t + '\\s*>', 'gi')) || []).length;
      if (open !== close) out.push('<' + t + '> opened ' + open + '×, closed ' + close + '×');
    });
    return out;
  }

  // The latest SAVED catalog (from GitHub via /api/catalog), so a product
  // saved a minute ago -- before the site has redeployed -- is not reported
  // as missing; the published file is the fallback. Re-read at most once a
  // minute.
  function loadCatalogIds() {
    if (CATALOG && Date.now() - CATALOG.at < 60000) return Promise.resolve(CATALOG);
    function build(list) {
      var c = { ok: list.length > 0, products: {}, merchants: {}, at: Date.now() };
      list.forEach(function (p) { c.products[p.id] = 1; c.merchants[p.merchantSlug] = 1; });
      if (c.ok) CATALOG = c;
      return c;
    }
    return fetch('/api/catalog', { cache: 'no-store' })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (d) {
        if (d && Array.isArray(d.products)) return build(d.products);
        return fetch('/js/products.js', { cache: 'no-store' })
          .then(function (r) { return r.ok ? r.text() : ''; })
          .then(function (t) { return build(t ? listFrom(t, 'PRODUCTS') : []); });
      })
      .catch(function () { return { ok: false, products: {}, merchants: {}, at: 0 }; });
  }

  /*
   * Split a block into its settings and its article. Tolerates what AI
   * replies add: ``` fences around the block or the article, and a sentence
   * before the first --- line. Returns { head, body, notes } or { error }.
   */
  function splitBlock(text) {
    var notes = [];
    var t = String(text || '').replace(/\r\n?/g, '\n').replace(/^﻿/, '');
    var fence = /```[a-z]*[ \t]*\n([\s\S]*?)\n[ \t]*```/i.exec(t);
    if (fence && /^---[ \t]*$/m.test(fence[1])) { t = fence[1]; notes.push('Took the block out of its ``` code fence.'); }
    var open = /^---[ \t]*$/m.exec(t);
    if (!open) {
      return { error: 'The block must start with a line of three dashes (---), then the settings (one "name: value" ' +
                      'per line), then another --- line, then the article.' };
    }
    if (t.slice(0, open.index).trim()) notes.push('Ignored the text before the first --- line.');
    var rest = t.slice(open.index + open[0].length).replace(/^\n/, '');
    var close = /^---[ \t]*$/m.exec(rest);
    if (!close) return { error: 'The settings are never closed: add a line with just --- after them, before the article.' };
    var body = rest.slice(close.index + close[0].length).replace(/^\n/, '').trim();
    var bodyFence = /^```[a-z]*[ \t]*\n([\s\S]*?)\n[ \t]*```$/i.exec(body);
    if (bodyFence) { body = bodyFence[1].trim(); notes.push('Took the article out of its ``` code fence.'); }
    return { head: rest.slice(0, close.index), body: body, notes: notes };
  }

  /*
   * Check a raw block against a post. Resolves to
   *   { errors, warnings, notes, changes, unsafe }
   * changes holds every field the block sets, ready for commitEdit().
   */
  function checkBlock(row, text) {
    var R = { errors: [], warnings: [], notes: [], changes: null, unsafe: [] };
    var d = row.data;
    if (String(text || '').length > 300000) {
      R.errors.push('The block is too long (over 300,000 characters).');
      return Promise.resolve(R);
    }
    var parts = splitBlock(text);
    if (parts.error) { R.errors.push(parts.error); return Promise.resolve(R); }
    R.notes = parts.notes;
    var head = parts.head, body = parts.body;

    // ---- settings
    var v = {}, lit = {};
    head.split('\n').forEach(function (line, i) {
      if (!line.trim() || /^\s*#/.test(line)) return;
      var m = /^\s*([A-Za-z][A-Za-z ]*?)\s*:[ \t]?(.*)$/.exec(line);
      if (!m) { R.errors.push('Settings line ' + (i + 1) + ' is not "name: value": ' + line.slice(0, 70)); return; }
      var key = m[1].toLowerCase().replace(/\s+/g, ' ');
      var f = RAW_KEYS[key];
      if (!f) { R.errors.push('Unknown setting "' + m[1] + '" (line ' + (i + 1) + '). The settings are: ' + RAW_KEY_LIST + '.'); return; }
      if (f in v) R.warnings.push('"' + m[1] + '" is set twice — the last one is used.');
      // "Title" -> Title, but "Pack light," says Maya. "Really." stays as it is.
      lit[f] = m[2].trim();
      v[f] = lit[f].replace(/^(["'])((?:(?!\1).)*)\1$/, '$2').trim();
    });
    var ch = {};
    // A line left as the block showed it means "unchanged": the post keeps its
    // exact value -- a title that is itself in quotes, a multi-line excerpt --
    // rather than the one-line form the block displays.
    function same(f) {
      var shown = oneLine(d[f]);
      return f in lit && (lit[f] === shown || v[f] === shown);
    }

    if (!v.name) R.errors.push('title: missing — every post needs a title.');
    else {
      ch.name = same('name') ? d.name : v.name;
      if (ch.name.length > 120) R.warnings.push('The title is ' + ch.name.length + ' characters; under ~70 reads best in search results.');
    }

    var others = rows.filter(function (r) { return r !== row; });
    var byId = {};
    others.forEach(function (r) { if (r.data.id) byId[r.data.id] = r; });
    if (v.id) {
      var slug = tidySlug(v.id);
      if (slug !== v.id) R.notes.push('Permalink tidied to "' + slug + '".');
      if (!slug) R.errors.push('permalink: "' + v.id + '" has no usable letters or numbers.');
      else if (byId[slug]) {
        ch.id = freeSlug(slugify(ch.name || v.id), row);
        R.warnings.push('The permalink "' + slug + '" belongs to “' + (byId[slug].data.name || slug) +
                        '”, so this post gets "' + ch.id + '" instead.');
      } else ch.id = slug;
    } else if (!d.id && ch.name) {
      ch.id = freeSlug(slugify(ch.name), row);
    }
    if (ch.id && d.id && ch.id !== d.id && !d.hidden) {
      R.warnings.push('This changes the permalink of a PUBLISHED post (' + d.id + ' → ' + ch.id + '): existing links to it will break.');
    }

    if (v.hidden) {
      var st = v.hidden.toLowerCase();
      if (/^(draft|hidden|unpublished)$/.test(st)) ch.hidden = true;
      else if (/^(published|publish|live|public)$/.test(st)) {
        ch.hidden = undefined;
        if (d.hidden) R.notes.push('Status is published: this post goes live on the next Save.');
      } else R.errors.push('status: "' + v.hidden + '" — use draft or published.');
    }

    if (v.dateMs) {
      var ms = parseRawDate(v.dateMs);
      if (!isFinite(ms)) R.errors.push('date: "' + v.dateMs + '" — write it as 2026-09-23 14:30 (Michigan time) or September 23, 2026.');
      else {
        if (d.dateMs && toZoned(d.dateMs) === toZoned(ms)) ms = d.dateMs;   // same time as shown: unchanged
        ch.dateMs = ms; ch.dateLabel = dateLabelOf(ms);
        if (ms > Date.now() + 365 * 86400000) R.warnings.push('The date is more than a year away (' + ch.dateLabel + ').');
      }
    } else if (!d.dateMs) {
      ch.dateMs = nowMinute(); ch.dateLabel = dateLabelOf(ch.dateMs);
    }

    if (v.cat) {
      var want = v.cat.toLowerCase(), hit = null;
      blogCategories().forEach(function (c) {
        if (c.id === want || String(c.label).toLowerCase() === want) hit = c;
      });
      if (hit) { ch.cat = hit.id; ch.catLabel = hit.label; }
      else {
        R.errors.push('category: "' + v.cat + '" is not a blog category. Use one of: ' +
          blogCategories().map(function (c) { return c.label; }).join(', ') +
          ' — or create it first with “+ New category…” in the form.');
      }
    }

    if (v.author) {
      var who = v.author.toLowerCase();
      if (/^(none|no byline|-)$/.test(who)) { ch.author = undefined; ch.authors = undefined; }
      else {
        var person = null;
        TEAM_OPTIONS.forEach(function (tm) {
          if (tm.id && (tm.id === who || String(tm.name || '').toLowerCase() === who)) person = tm;
        });
        if (person) { ch.author = person.id; ch.authors = undefined; }
        else if (v.author === d.author) { /* unchanged: keep it */ }
        else {
          R.errors.push('author: "' + v.author + '" is not on the Team tab. Use one of: ' +
            (TEAM_OPTIONS.filter(function (tm) { return tm.id; }).map(function (tm) { return tm.id; }).join(', ') || '(nobody yet)') +
            ' — or leave it empty.');
        }
      }
    }

    if (v.img) {
      if (!LOGO_RE.test(v.img)) R.errors.push('cover image: must be a full https:// image address (or a path under images/).');
      else {
        ch.img = v.img;
        if (/^http:\/\//i.test(v.img)) R.warnings.push('The cover image uses http:// — browsers may block it on this https site; use https://.');
      }
    }

    if ('excerpt' in v) {
      ch.excerpt = same('excerpt') ? d.excerpt : (v.excerpt || undefined);
      if (v.excerpt.length > 320) R.warnings.push('The excerpt is ' + v.excerpt.length + ' characters; cards show about the first 150.');
    }

    if ('related' in v) {
      var picks = [];
      v.related.split(/[,\n]+/).map(function (x) { return x.trim(); }).filter(Boolean).forEach(function (x) {
        var r = byId[x] || byId[tidySlug(x)];
        if (!r) others.forEach(function (o) { if (String(o.data.name || '').toLowerCase() === x.toLowerCase()) r = o; });
        if (!r) R.warnings.push('continue reading: no post "' + x + '" — left out.');
        else if (picks.indexOf(r.data.id) < 0) picks.push(r.data.id);
      });
      if (picks.length > 3) { R.warnings.push('continue reading: only the first 3 are used.'); picks = picks.slice(0, 3); }
      ch.related = picks.length ? picks : undefined;
    }

    // ---- the article
    var html = articleHtml(body);
    if (body && looksLikeMarkdown(body)) R.notes.push('The article was Markdown; converted it to HTML.');
    else if (body && !/<[a-z][^>]*>/i.test(body)) R.notes.push('The article was plain text; made paragraphs from it.');
    R.unsafe = unsafeParts(html);
    if (R.unsafe.length) {
      R.errors.push('The article contains code that is not allowed in posts: ' + R.unsafe.join(', ') +
                    '. Press “Remove unsafe parts”, or delete it yourself.');
    }
    unclosedTags(html).forEach(function (u) { R.warnings.push('Unbalanced HTML: ' + u + ' — check the formatting.'); });
    var n;
    if ((n = (html.match(/\sstyle\s*=/gi) || []).length)) R.notes.push('Removed ' + n + ' inline style' + (n === 1 ? '' : 's') + ' (the site’s own styling is used).');
    if ((n = (html.match(/\sclass\s*=/gi) || []).length)) R.notes.push('Removed ' + n + ' class attribute' + (n === 1 ? '' : 's') + '.');
    if (/<h1\b/i.test(html)) R.notes.push('Turned <h1> into <h2> — the page title is the only h1.');
    var clean = cleanHtml(html);

    // An AI often repeats the title as the first heading; the page already shows it.
    if (ch.name) {
      var doc0 = new DOMParser().parseFromString('<body>' + clean + '</body>', 'text/html');
      var first = doc0.body.firstElementChild;
      if (first && /^H[234]$/.test(first.tagName) &&
          first.textContent.trim().toLowerCase() === ch.name.toLowerCase()) {
        first.remove();
        clean = doc0.body.innerHTML;
        R.notes.push('Removed the first heading: it repeated the title, which the page already shows.');
      }
    }
    if (clean.length > 200000) R.errors.push('The article is too long (over 200,000 characters of HTML).');
    if (clean && clean !== (d.contentHTML || '') && plainText(clean) === plainText(d.contentHTML)) {
      R.notes.push('The article text is unchanged; only its HTML was tidied (e.g. empty attributes removed).');
    }
    if (!clean && wordCount(d.contentHTML)) {
      R.warnings.push('The block has no article, so applying it REMOVES the current article (' +
                      wordCount(d.contentHTML).toLocaleString() + ' words).');
    }
    ch.contentHTML = clean || undefined;

    // ---- whole-post rules (the same ones Save uses)
    var hidden = 'hidden' in ch ? ch.hidden : d.hidden;
    var words = wordCount(clean);
    if (!hidden) {
      if (!('cat' in ch ? ch.cat : d.cat)) R.errors.push('A published post needs a category (or set status: draft).');
      if (!('img' in ch ? ch.img : d.img)) R.errors.push('A published post needs a cover image (or set status: draft).');
      if (!words) R.errors.push('The article is empty (or set status: draft).');
      else if (words < 150) R.warnings.push('The article is only ' + words + ' words long.');
    }
    var allText = [ch.name || '', ch.excerpt || '', plainText(clean)].join(' ');
    var ph = /\[(?:[^\]\n]{0,40})(?:insert|write|topic|describe|todo|tbd|placeholder|your )[^\]\n]{0,40}\]|lorem ipsum|\bTODO\b|\bTBD\b/i.exec(allText);
    if (ph) R.warnings.push('Looks like placeholder text is left in: “' + ph[0] + '”.');

    // ---- links: pages on this site that do not exist would show "not found"
    var doc = new DOMParser().parseFromString('<body>' + clean + '</body>', 'text/html');
    var links = Array.prototype.map.call(doc.querySelectorAll('a[href]'), function (a) { return a.getAttribute('href'); });
    Array.prototype.forEach.call(doc.querySelectorAll('img'), function (im) {
      if (/^http:\/\//i.test(im.getAttribute('src'))) R.warnings.push('An image uses http:// and may be blocked: ' + im.getAttribute('src'));
      if (!im.getAttribute('alt')) R.notes.push('An image has no description (alt text): ' + im.getAttribute('src'));
    });
    var dropped = (html.match(/<img\b/gi) || []).length - doc.querySelectorAll('img').length;
    if (dropped > 0) R.warnings.push(dropped + ' image' + (dropped === 1 ? ' was' : 's were') + ' left out: images need a full https:// address.');

    R.changes = ch;
    return loadCatalogIds().then(function (cat) {
      var postIds = {};
      rows.forEach(function (r) { if (r.data.id) postIds[r.data.id] = r; });
      if (ch.id) postIds[ch.id] = row;
      var blogCats = {};
      blogCategories().forEach(function (c) { blogCats[c.id] = 1; });
      var checked = 0;
      links.forEach(function (href) {
        var m = /^(?:https?:\/\/(?:www\.)?mycampuskorner\.com)?\/?([a-z-]+?)(?:\.html)?(?:\?id=([^&#]*))?(?:[#&].*)?$/i.exec(href);
        if (!m || /^https?:/i.test(href) && !/mycampuskorner\.com/i.test(href)) return;
        var page = m[1].toLowerCase(), id = null;
        if (m[2]) {
          try { id = decodeURIComponent(m[2]); } catch (e) {
            R.warnings.push('A link has a broken address (bad % code): ' + href);
            return;
          }
        }
        if (!SITE_PAGES[page]) { R.warnings.push('Link to a page this site doesn’t have: ' + href); return; }
        if (id === null) return;
        checked++;
        var ok = page === 'product' ? (!cat.ok || cat.products[id])
               : page === 'merchant' ? (!cat.ok || cat.merchants[id])
               : page === 'category' ? CATEGORIES.some(function (c) { return c[0] === id; })
               : page === 'blog-post' ? !!postIds[id]
               : page === 'blog-category' ? !!blogCats[id] : true;
        if (!ok) R.warnings.push('Link to a ' + page.replace('-', ' ') + ' that doesn’t exist (visitors would see “not found”): ' + href);
        else if (page === 'blog-post' && postIds[id].data.hidden && postIds[id] !== row) {
          R.warnings.push('Link to a post that is still a draft: ' + href);
        }
      });
      if (checked && !cat.ok) R.notes.push('Could not load the catalog, so product links were not checked.');
      return R;
    });
  }

  function aiInstructions(block) {
    var cats = blogCategories().map(function (c) { return c.label; }).join(', ');
    var people = TEAM_OPTIONS.filter(function (t) { return t.id; }).map(function (t) {
      return t.id + ' (' + (t.name || t.id) + (t.role ? ', ' + t.role : '') + ')';
    }).join('; ');
    return [
      'Write a NEW blog post for MyCampusKorner, a website that recommends college essentials to students and their parents.',
      '',
      'Topic: [DESCRIBE THE NEW POST HERE]',
      '',
      'Reply with ONE block in exactly the format of the example at the end, and nothing else — no introduction and no code fences:',
      '- Between the two --- lines, keep one "name: value" setting per line, using the same names as the example.',
      '- title: a new, specific title.',
      '- permalink: leave it empty (it is made from the title).',
      '- status: draft',
      '- date: leave it as it is.',
      '- category: exactly one of: ' + cats,
      '- author: ' + (people ? 'one of these ids: ' + people + ' — or leave it empty.' : 'leave it empty.'),
      '- cover image: keep the example’s address unless you are given another https:// image address.',
      '- excerpt: one or two plain sentences that make people want to read the post.',
      '- continue reading: leave it empty.',
      '- After the second --- line, write the article in simple HTML using only <p>, <h2>, <h3>, <strong>, <em>, <ul>, <ol>, <li>, <blockquote> and <a href="https://...">. No <h1> (the title is shown separately), no <html>, <head>, <body>, <style> or <script>, no class or style attributes, and no Markdown.',
      '- Only include links you were given or are certain exist. Never invent product links.',
      '',
      'Example:',
      '',
      block.trim()
    ].join('\n') + '\n';
  }

  function copyText(text, button) {
    function done(ok) {
      var was = button.textContent;
      button.textContent = ok ? 'Copied ✓' : 'Copy failed — select the text and copy it';
      setTimeout(function () { button.textContent = was; }, ok ? 1600 : 3200);
    }
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(text).then(function () { done(true); }, function () { done(fallback()); });
    } else {
      done(fallback());
    }
    function fallback() {
      var ta = el('textarea');
      ta.value = text;
      ta.style.cssText = 'position:fixed;left:-9999px;top:0';
      document.body.appendChild(ta);
      ta.select();
      var ok = false;
      try { ok = document.execCommand('copy'); } catch (e) {}
      ta.remove();
      return ok;
    }
  }

  // The panel. raw.on = showing; the textarea keeps what the person typed until
  // Apply / Reset, even when the post changes underneath (they get a notice).
  var raw = {
    on: false, row: null, base: '', stale: false, parts: null,
    dirty: function () { return !!(raw.on && raw.parts && raw.parts.text.value !== raw.base); },
    reset: function () {
      raw.on = false; raw.row = null; raw.base = ''; raw.stale = false; raw.parts = null;
      $('drRaw').textContent = '';
    },
    build: function (row) {
      var box = $('drRaw');
      box.textContent = '';
      var bar = el('div', 'raw-bar');
      var copy = el('button', '', 'Copy block');
      var copyAi = el('button', '', 'Copy with AI instructions');
      var reset = el('button', '', 'Reset to current');
      var check = el('button', '', 'Check');
      var apply = el('button', 'primary', 'Apply to this post');
      var strip = el('button', 'ghost-danger', 'Remove unsafe parts');
      [copy, copyAi, reset, check, apply, strip].forEach(function (b) { b.type = 'button'; });
      copy.title = 'Copy the block exactly as it is below';
      copyAi.title = 'Copy the block with instructions for ChatGPT, Claude, etc. to write a new post in the same format';
      reset.title = 'Throw away changes in the box and show the post as it is now';
      strip.hidden = true;
      bar.appendChild(copy); bar.appendChild(copyAi);
      bar.appendChild(el('span', 'spacer'));
      bar.appendChild(reset); bar.appendChild(check); bar.appendChild(apply);
      var help = el('p', 'raw-help',
        'The whole post as one block: its settings between the two --- lines, then the article HTML. Copy it — for ' +
        'example to ask an AI for a new post in the same format — edit it here, or paste a new block over it. ' +
        'Nothing changes until “Apply to this post”, which checks the block first; Undo reverts an Apply. ' +
        'Dates are Michigan time. Leave a setting empty to keep what the post has (an empty excerpt means “from the article”).');
      var stale = el('div', 'raw-stale',
        'This post changed after the block was made (in the form, or by another editor). Applying would overwrite ' +
        'those changes — press “Reset to current” to start from the latest.');
      stale.hidden = true;
      var text = el('textarea', 'raw-text');
      text.spellcheck = false;
      text.setAttribute('data-native-undo', '');
      text.setAttribute('aria-label', 'The post as one raw block');
      var report = el('div', 'raw-report');
      report.setAttribute('aria-live', 'polite');
      box.appendChild(bar); box.appendChild(help); box.appendChild(stale);
      box.appendChild(text); box.appendChild(report); box.appendChild(strip);
      raw.parts = { text: text, report: report, stale: stale, strip: strip, apply: apply, check: check };
      raw.row = row;
      raw.base = postToBlock(row.data);
      text.value = raw.base;
      raw.stale = false;

      copy.addEventListener('click', function () { copyText(text.value, copy); });
      copyAi.addEventListener('click', function () { copyText(aiInstructions(text.value), copyAi); });
      reset.addEventListener('click', function () {
        if (raw.dirty() && !confirm('Throw away the changes in the box?')) return;
        raw.base = postToBlock(row.data);
        text.value = raw.base;
        raw.stale = false; stale.hidden = true;
        report.textContent = ''; strip.hidden = true;
      });
      check.addEventListener('click', function () { raw.run(false); });
      apply.addEventListener('click', function () { raw.run(true); });
      strip.addEventListener('click', function () {
        var parts = splitBlock(text.value);
        if (parts.error) return;
        text.value = '---\n' + parts.head.replace(/\n*$/, '\n') + '---\n' + pretty(cleanHtml(articleHtml(parts.body))) + '\n';
        strip.hidden = true;
        raw.run(false);
      });
    },
    run: function (applyIt) {
      var row = raw.row, p = raw.parts;
      if (!row || !p || !rowAlive(row)) return;
      p.apply.disabled = p.check.disabled = true;
      p.report.textContent = 'Checking…';
      var sent = p.text.value;
      checkBlock(row, sent).then(function (R) {
        p.apply.disabled = p.check.disabled = false;
        // The panel was closed, reopened or switched meanwhile: this block is gone.
        if (raw.parts !== p || raw.row !== row || !rowAlive(row)) return;
        // Typed into while it was being checked: that result is for an older
        // text -- applying it would overwrite what was just typed.
        if (p.text.value !== sent) {
          p.report.textContent = 'The block changed while it was being checked. Press “' +
                                 (applyIt ? 'Apply to this post' : 'Check') + '” again.';
          return;
        }
        raw.show(R);
        if (!applyIt || R.errors.length) return;
        if (raw.stale && !confirm('This post changed after the block was made. Apply anyway and overwrite those changes?')) return;
        if (R.warnings.length && !confirm('Apply with ' + R.warnings.length + ' warning' +
            (R.warnings.length === 1 ? '' : 's') + '?\n\n' + R.warnings.join('\n'))) return;
        var changes = {};
        Object.keys(R.changes).forEach(function (f) {
          if (JSON.stringify(R.changes[f]) !== JSON.stringify(row.data[f])) changes[f] = R.changes[f];
        });
        if (!Object.keys(changes).length) {
          p.report.insertBefore(el('div', 'r-ok', 'Nothing to apply — the post already matches the block.'), p.report.firstChild);
          return;
        }
        commitEdit(row, changes, {});
        raw.base = postToBlock(row.data);
        p.text.value = raw.base;
        raw.stale = false; p.stale.hidden = true;
        p.report.insertBefore(el('div', 'r-ok', 'Applied ✓ ' + Object.keys(changes).length + ' field' +
          (Object.keys(changes).length === 1 ? '' : 's') + ' updated in the shared draft. Undo reverts it; Save publishes.'),
          p.report.firstChild);
      }, function (e) {
        p.apply.disabled = p.check.disabled = false;
        p.report.textContent = 'Could not check the block: ' + (e && e.message ? e.message : e);
      });
    },
    show: function (R) {
      var p = raw.parts;
      p.report.textContent = '';
      function section(cls, title, items) {
        if (!items.length) return;
        var s = el('div', cls);
        s.appendChild(el('h4', '', title));
        var ul = el('ul');
        items.forEach(function (x) { ul.appendChild(el('li', '', x)); });
        s.appendChild(ul);
        p.report.appendChild(s);
      }
      if (!R.errors.length) {
        p.report.appendChild(el('div', 'r-ok', R.warnings.length
          ? 'The block can be applied — read the warnings first.' : 'The block looks good and can be applied.'));
      }
      section('r-err', 'Fix before applying', R.errors);
      section('r-warn', 'Warnings', R.warnings);
      section('r-note', 'Tidied automatically', R.notes);
      p.strip.hidden = !R.unsafe.length;
    },
    refresh: function (row) {
      if (!raw.parts || raw.row !== row) return;
      var now = postToBlock(row.data);
      if (now === raw.base) return;
      if (raw.parts.text.value === raw.base) {          // untouched: follow the post
        raw.base = now;
        raw.parts.text.value = now;
      } else {
        raw.stale = true;
        raw.parts.stale.hidden = false;
      }
    }
  };

  function paintMode(on) {
    Array.prototype.forEach.call($('drMode').querySelectorAll('button'), function (b) {
      b.setAttribute('aria-pressed', String((b.getAttribute('data-mode') === 'raw') === on));
    });
    $('drBody').hidden = on;
    $('drRaw').hidden = !on;
  }

  // An unapplied block the program closed (see closeDrawer). Back into the
  // Raw block of its post, marked as made from an older version...
  var rawKept = null;
  function restoreRaw() {
    var k = rawKept;
    rawKept = null;
    setRawMode(true);
    if (!raw.parts) return;
    raw.parts.text.value = k.text;
    raw.stale = true;
    raw.parts.stale.hidden = false;
    raw.parts.report.textContent = 'Your unapplied block was kept: the post reloaded underneath it (see the ' +
                                   'notice at the top). Check it, then apply — or Reset to current.';
  }
  // ...or, when that post is gone, a copy offered under the status line.
  function keptBlock() {
    var k = rawKept, st = $('status');
    rawKept = null;
    if (!k) return;
    if (!/\bshow\b/.test(st.className)) st.className = 'show warn';
    var line = el('div', 'kept', 'Your unapplied Raw block for “' + (k.name || 'a post') + '” was closed: ' +
                                 'that post is not in the draft any more. ');
    var b = el('button', '', 'Copy the block');
    b.type = 'button';
    b.addEventListener('click', function () { copyText(k.text, b); });
    line.appendChild(b);
    st.appendChild(line);
  }

  function setRawMode(on) {
    if (on === raw.on) return;
    if (!on && raw.dirty() && !confirm('Leave the raw block without applying it? Its changes are thrown away.')) {
      return;
    }
    var row = drawerRow;
    paintMode(on);
    if (on && row) {
      raw.build(row);
      raw.on = true;
      raw.parts.text.focus();
      raw.parts.text.setSelectionRange(0, 0);
      raw.parts.text.scrollTop = 0;
    } else {
      raw.reset();
      if (row) refreshDrawer(row);
    }
  }

  function initDrawer() {
    if (!DOC.drawer) return;
    $('drClose').addEventListener('click', function () { closeDrawer(); });
    $('drawerShade').addEventListener('click', function () { closeDrawer(); });
    Array.prototype.forEach.call($('drMode').querySelectorAll('button'), function (b) {
      b.addEventListener('click', function () { setRawMode(b.getAttribute('data-mode') === 'raw'); });
    });
    $('drawer').addEventListener('focusin', function () { if (drawerRow) focusRid = drawerRow.rid; });
    $('drawer').addEventListener('focusout', function (ev) {
      if (ev.target && ev.target.__act) ev.target.__act = null;
    });
  }

  // ------------------------------------------------------------- controls
  function toggleMenu(id) {
    var el = $(id);
    var open = el.classList.contains('open');
    $('colsMenu').classList.remove('open');
    $('histPanel').classList.remove('open');
    if (!open) el.classList.add('open');
    return !open;
  }
  $('cols').addEventListener('click', function (ev) {
    ev.stopPropagation();
    toggleMenu('colsMenu');
  });
  $('hist').addEventListener('click', function (ev) {
    ev.stopPropagation();
    if (toggleMenu('histPanel')) loadHistory();
  });
  document.addEventListener('click', function (ev) {
    if (!ev.target.closest || !ev.target.closest('.menu')) {
      $('colsMenu').classList.remove('open');
      $('histPanel').classList.remove('open');
    }
  });

  $('add').addEventListener('click', function () {
    if (mode === 'boot') return;       // wait until the list has loaded
    var pos, row;
    if (DOC.addAtEnd) {
      pos = rows.length ? rows[rows.length - 1].pos + 1 : 1;
      row = makeRow(DOC.blank(), newRid(), pos);
      rows.push(row);
      rowsEl.appendChild(row.el);
    } else {
      pos = rows.length ? rows[0].pos - 1 : 1;
      row = makeRow(DOC.blank(), newRid(), pos);
      rows.unshift(row);
      rowsEl.insertBefore(row.el, rowsEl.firstChild);
    }
    if (row.rid) byRid[row.rid] = row;
    renumber(); counts();
    if (mode === 'sync') {
      queueOp({ rid: row.rid, pos: pos, data: JSON.parse(JSON.stringify(row.data)) });
    } else {
      markDirty(true);
    }
    pushAction(createAction(row));
    $('q').value = ''; filter();
    row.el.scrollIntoView({ block: 'center' });
    if (DOC.openOnAdd) { openDrawer(row, 'name'); return; }
    var nameInput = fieldInput(row, 'name');
    nameInput.focus();
    if (FIELDS.indexOf('id') < 0) return;
    // Fill the id from the name once, so new rows get a sane permalink.
    nameInput.addEventListener('blur', function once() {
      nameInput.removeEventListener('blur', once);
      var idInput = fieldInput(row, 'id');
      if (idInput && !idInput.value.trim() && nameInput.value.trim()) {
        var a = fieldAction(row, 'id', row.data.id);
        a.st.after = slugify(nameInput.value);
        pushAction(a);
        setFieldValue(row, 'id', a.st.after);
      }
    });
  });

  $('reload').addEventListener('click', function () {
    if (mode === 'boot') return;
    if (mode === 'sync') {
      if (!confirm('Reset the shared draft for EVERYONE back to the last saved version of the ' + DOC.what + '?\n' +
                   'All unpublished edits — yours and anyone else\'s — are discarded.')) return;
      pendingPatch = {}; pendingOps = [];
      setStatus('warn', 'Resetting draft…');
      fetch(DOC.draftApi, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ client: CLIENT, name: NAME, reset: true })
      })
        .then(draftReply)
        .then(function (d) {
          apply(d);
          setStatus('warn', 'Draft reset to the last saved ' + DOC.what + '.');
          schedulePoll();
        })
        .catch(function (e) { setStatus('err', 'Reset failed: ' + e.message); });
      return;
    }
    if (dirty && !confirm('Discard unsaved changes and reload from ' + DOC.file + '?')) return;
    load();
  });

  $('save').addEventListener('click', save);
  $('q').addEventListener('input', filter);
  $('q').addEventListener('keydown', function (ev) {
    if (ev.key === 'Escape') { $('q').value = ''; filter(); $('q').blur(); }
  });

  document.addEventListener('keydown', function (ev) {
    var meta = ev.metaKey || ev.ctrlKey;
    if (meta && !ev.altKey) {
      var k = ev.key.toLowerCase();
      if (k === 's') {
        ev.preventDefault();
        if (!$('save').disabled) save();
        return;
      }
      // Cell edits get a spreadsheet-wide undo, so the browser's per-input
      // text undo is deliberately overridden (the filter box keeps its own,
      // and so does the article editor -- see [data-native-undo]).
      if (ev.target !== $('q') &&
          !(ev.target.closest && ev.target.closest('[data-native-undo]'))) {
        if (k === 'z') { ev.preventDefault(); if (ev.shiftKey) redo(); else undo(); return; }
        if (k === 'y') { ev.preventDefault(); redo(); return; }
      }
      return;
    }
    if (ev.key === 'Escape' && drawerRow) {
      ev.preventDefault();
      closeDrawer();
      return;
    }
    if (ev.key === '/' && !ev.altKey) {
      var t = ev.target;
      var typing = t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.tagName === 'SELECT' ||
                         t.isContentEditable);
      if (!typing) { ev.preventDefault(); $('q').focus(); $('q').select(); }
    }
  });

  // Edits the server has not confirmed yet: queued, waiting for the debounce,
  // or riding on the request in flight.
  function unsentEdits() {
    if (pendingOps.length || flushTimer || sendingOps) return true;
    for (var k in pendingPatch) return true;
    return false;
  }
  window.addEventListener('beforeunload', function (ev) {
    // Sync mode: edits normally reach the draft within half a second, so this
    // only asks when some have not (a slow or dropped connection).
    if (mode === 'sync' ? unsentEdits() : dirty) { ev.preventDefault(); ev.returnValue = ''; }
  });
  window.addEventListener('pagehide', function () {
    if (mode !== 'sync' || !(pendingOps.length || Object.keys(pendingPatch).length)) return;
    if (!inFlight) { tick(true); return; }   // keepalive lets it outlive the tab
    // A poll is on its way: send the rest alongside it rather than not at all.
    fetch(DOC.draftApi, {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, keepalive: true,
      body: JSON.stringify({ client: CLIENT, name: NAME, since: cursor, epoch: epoch, ops: takeOps() })
    }).catch(function () {});
  });

  // Diagnostics handle for the browser console: catalogSync.state(), and
  // catalogSync.tick() to force a sync pump right now.
  window.catalogSync = {
    tick: function () { tick(); },
    undo: function () { return undo(); },
    redo: function () { return redo(); },
    state: function () {
      return { view: VIEW, mode: mode, cursor: cursor, epoch: epoch, seq: seqCounter,
               publishedSeq: publishedSeq, pendingOps: pendingOps.length,
               pendingRows: Object.keys(pendingPatch).length,
               inFlight: inFlight, name: NAME,
               undoDepth: undoStack.length, redoDepth: redoStack.length,
               nav: navAt };
    }
  };

  // Section chrome: title, tabs, and the wording that names the list.
  document.documentElement.classList.add('view-' + VIEW);
  document.title = DOC.title;
  $('title').textContent = DOC.title;
  Array.prototype.forEach.call(document.querySelectorAll('.tabs a'), function (a) {
    if (a.getAttribute('data-view') === VIEW) a.setAttribute('aria-current', 'page');
  });
  $('add').textContent = '+ Add ' + DOC.one;
  $('q').placeholder = DOC.filterHint;
  $('note').textContent = DOC.soloNote;

  buildHead();
  applyCols();
  initResize();
  buildColsMenu();
  undoUI();
  initPreview();
  initDrawer();
  if (DOC.boot) DOC.boot();
  boot();
})();
</script>
</body>
</html>
