name: Rebuild listings

# The admin editor commits data files and nothing else: js/products.js,
# js/partners.js, js/blogs.js, js/team.js. Several pages carry that content
# as baked HTML so they stay crawlable and work with JavaScript off, and the
# product images and partner logos are kept as copies on the site rather
# than loaded from the retailers. This job is what keeps all of it in step:
#
#   fetch_images.py     images/products/, images/partners/,  <- js/products.js,
#                       js/local-images.js                       js/partners.js
#   build_listings.py   store.html, index.html                <- js/products.js
#   build_content.py    blog.html, index.html, about.html     <- js/blogs.js, js/team.js
#
# It never edits a data file, so its commit never looks like "a commit made
# outside the editor" to the shared draft.
#
# Cloudflare Pages then deploys the result.
#
# This runs on GitHub's own runner and only ever adds a commit of its own. It
# never rebases, never merges and never force-pushes, so it cannot rewrite
# anything already on the branch and it has no effect on a local clone beyond
# the usual "Pull origin" in GitHub Desktop.
on:
  push:
    branches: [main]
    paths:
      - 'js/products.js'
      - 'js/partners.js'
      - 'js/blogs.js'
      - 'js/team.js'
      - 'build_listings.py'
      - 'build_content.py'
      - 'fetch_images.py'
  workflow_dispatch:        # lets you run it by hand from the Actions tab

# Needed so the workflow can push the rebuilt pages back.
permissions:
  contents: write

concurrency:
  # If two saves land close together, let the newer one win rather than
  # racing to commit rebuilt pages on top of each other. Safe because the job
  # below always rebuilds from whatever the data files hold at that moment,
  # so the surviving run covers the cancelled one's change too.
  group: rebuild-listings
  cancel-in-progress: true

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # A full clone: the job below fetches and resets to the branch head,
          # and pushing from a shallow clone can be refused.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      # Pillow scales oversized images down for fetch_images.py. Pinned so the
      # copies come out the same as from a local run. Without it the images
      # are kept exactly as downloaded, so a failed install is not fatal.
      - name: Image tools
        run: pip install "pillow==12.3.0" || echo "Pillow not installed - images are kept as downloaded"

      - name: Rebuild the baked pages and commit them
        run: |
          set -u
          PAGES="store.html index.html blog.html about.html"
          IMAGES="js/local-images.js images/products images/partners"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # A Save from the editor commits a data file straight to this branch,
          # so one can land while this job is running. Rather than reconciling
          # two histories, each attempt simply starts again from the branch as
          # it is now and rebuilds from the data files it finds there. That
          # needs no rebase and no merge: the result is always one plain commit
          # on top of the current head, and it is built from the newest data
          # rather than replaying a build made from older data.
          for attempt in 1 2 3; do
            git fetch origin "$GITHUB_REF_NAME"
            git reset --hard "origin/$GITHUB_REF_NAME"
            # A previous attempt's downloads are untracked, so reset leaves
            # them; clear them so only what this attempt needs is committed.
            git clean -fdq -- images/products images/partners

            # Copies first: build_listings.py bakes them into the cards. A
            # retailer refusing a download is reported, not fatal -- that
            # image just keeps showing from its own address.
            python fetch_images.py || echo "fetch_images.py failed - images keep their own addresses"
            # Both build scripts write index.html, each owning its own
            # containers, so they run one after the other.
            python build_listings.py
            python build_content.py

            if [ -z "$(git status --porcelain -- $PAGES $IMAGES)" ]; then
              echo "Pages and images already match the data files - nothing to commit."
              exit 0
            fi

            git add -- $PAGES
            # -A so a copy nothing uses any more is deleted from the repo too.
            for p in $IMAGES; do git add -A -- "$p" 2>/dev/null || true; done
            # No "[skip ci]" here. Cloudflare Pages treats that as its own
            # skip-build token, so it would ignore the very commit that carries
            # the rebuilt pages and the site would stay stale.
            # Nothing is needed to stop this workflow re-triggering itself: the
            # paths filter above only watches the data files and the three
            # scripts, and this commit touches none of them. (GitHub also
            # refuses to start workflows from GITHUB_TOKEN pushes.)
            git commit -m "Rebuild baked pages and image copies from the data files"

            if git push; then
              echo "Rebuilt pages pushed on attempt $attempt."
              exit 0
            fi
            echo "Push refused - a save landed while this ran. Starting again from the new head."
            sleep 5
          done

          echo "Could not push the rebuilt pages after 3 attempts."
          exit 1
